[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetech-docker-utils"
version = "0.1.0"
description = "LAN-first Docker image resolution, streaming and container management"
readme = "docker_utils/README.md"
requires-python = ">=3.11"
dependencies = ["docker>=7,<8"]

[project.scripts]
lan-docker = "docker_utils.cli:main"

[tool.setuptools]
packages = ["docker_utils"]

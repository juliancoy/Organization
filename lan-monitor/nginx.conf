user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 10.42.0.1:80;
        listen [::]:80 ipv6only=on;
        allow 10.42.0.0/24;
        allow 127.0.0.1;
        allow ::1;
        allow fe80::/10;
        deny all;
        server_name map.local;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        location / { try_files $uri $uri/ =404; }
        client_max_body_size 4m;
        client_body_timeout 8s;
        location /mcp {
            proxy_pass http://127.0.0.1:8089;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }
        # Run-scoped artifacts are finalized before publication and never overwritten.
        location = /api/distributed-tests/artifacts {
            proxy_pass http://127.0.0.1:8089;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, max-age=86400, immutable";
            proxy_read_timeout 10s;
        }
        # AI thread control is available only through loopback or an SSH tunnel.
        location ^~ /api/v1/master/codex/ { return 403; }
        location /api/ {
            proxy_pass http://127.0.0.1:8089;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 10s;
        }
    }
}

services:
  traffic:
    image: python:3.12-slim
    container_name: lan-monitor-traffic
    network_mode: host
    restart: unless-stopped
    user: "0:1000"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    command: [python, -u, /app/packet_monitor.py]
    volumes:
      - ./packet_monitor.py:/app/packet_monitor.py:ro
      - ./.runtime:/state
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
  view:
    image: nginx:alpine
    container_name: lan-monitor-view
    network_mode: host
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./view:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://10.42.0.1/api/health]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

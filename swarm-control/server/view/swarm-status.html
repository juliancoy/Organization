<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>LAN status · Swarm Control</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/swarm-status.css"><script type="module" src="/swarm-status.js"></script></head>
<body><main class="swarm-status"><a href="/">← Swarm Control</a><div class="status-heading"><div><h1>LAN status</h1><p>Your local network, through your paired Swarm Control session.</p></div><button id="refresh" type="button">Refresh</button></div><p id="feedback" role="status">Loading swarm status…</p><div id="overview"><section aria-labelledby="devices-title"><h2 id="devices-title">Machines</h2><p id="observed"></p><div class="machine-legend" aria-label="Task status colors"><span data-state="running">Running</span><span data-state="queued">Queued</span><span data-state="stopped">Stopped</span><span data-state="failed">Failed</span><span data-state="passed">Passed</span><span data-state="unavailable">Unavailable</span></div><div id="devices" class="status-grid"></div><p id="run"></p><button id="run-tests" type="button">Run distributed tests</button><p class="muted">Publishes current source revisions before testing.</p><p id="test-request" role="status"></p></section><details class="network-overview"><summary>Network overview</summary><p id="network"></p><div id="interfaces" class="status-grid"></div></details></div><section id="machine-detail" hidden aria-label="Machine details"><a href="#">← All machines</a><div id="machine-content"></div></section></main></body></html>

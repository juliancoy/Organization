services:
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp@sha256:3f86f6bcaa1d83f5c73a578ff263888570eb82688474bf587dcc51e6f3672a1c
    container_name: swarm-control-whisper
    restart: unless-stopped
    user: '65534:65534'
    working_dir: /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 4
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    ports: ['127.0.0.1:8094:8080']
    tmpfs: ['/tmp:size=128m,mode=1777']
    entrypoint: [/app/build/bin/whisper-server]
    command: ['--host', '0.0.0.0', '--port', '8080', '--model', '/app/models/ggml-base.en.bin', '--threads', '4', '--no-gpu', '--convert', '--suppress-nst', '--public', '/app/examples/server/public']
    logging:
      driver: none
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramtop"
version = "0.1.0"
description = "Honest, real-time Linux memory performance monitor"
requires-python = ">=3.10"
dependencies = ["textual>=1,<9", "rich>=13", "psutil>=5.9"]

[project.scripts]
ramtop = "ramtop.__main__:main"

[tool.setuptools.packages.find]
include = ["ramtop*"]
